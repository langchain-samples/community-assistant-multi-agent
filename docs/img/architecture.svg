<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- User -->
  <rect x="155" y="16" width="200" height="36" rx="18" fill="#ECECFF" stroke="#9370DB"/>
  <text x="255" y="39" text-anchor="middle" fill="#222">User + UserContext</text>
  <line x1="255" y1="52" x2="255" y2="106" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="40" y="76" width="680" height="454" rx="8" fill="#FAFAFA" stroke="#999"/>
  <text x="56" y="98" font-weight="600" fill="#222">Orchestrator: create_deep_agent</text>

  <!-- before_agent -->
  <rect x="60" y="108" width="640" height="82" rx="6" fill="#FFF4D6" stroke="#D9A400"/>
  <text x="76" y="127" font-size="13" font-weight="600" fill="#6B4E00">before_agent</text>
  <rect x="76" y="136" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#D9A400"/>
  <text x="90" y="154" font-weight="600" fill="#6B4E00">Safety check</text>
  <text x="90" y="171" font-size="12" fill="#6B4E00">blocks unsafe input</text>
  <rect x="392" y="136" width="292" height="44" rx="5" fill="#FFFFFF" stroke="#D9A400"/>
  <text x="406" y="154" font-weight="600" fill="#6B4E00">Broadness check</text>
  <text x="406" y="171" font-size="12" fill="#6B4E00">too vague? asks a follow-up first</text>
  <line x1="255" y1="190" x2="255" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent loop -->
  <rect x="60" y="210" width="390" height="200" rx="6" fill="#FFFFFF" stroke="#999" stroke-dasharray="5 4"/>
  <text x="76" y="230" fill="#555">Agent loop</text>

  <rect x="76" y="242" width="150" height="60" rx="6" fill="#ECECFF" stroke="#9370DB"/>
  <text x="151" y="277" text-anchor="middle" font-weight="600" fill="#222">model</text>

  <rect x="264" y="242" width="180" height="60" rx="6" fill="#ECECFF" stroke="#9370DB"/>
  <text x="354" y="264" text-anchor="middle" font-weight="600" fill="#222">tools</text>
  <text x="354" y="287" text-anchor="middle" font-size="12" fill="#6B4E00">wrap_tool_call: tool retry</text>

  <line x1="228" y1="272" x2="262" y2="272" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- tool list -->
  <line x1="274" y1="302" x2="274" y2="390" stroke="#bbb"/>
  <rect x="282" y="316" width="162" height="26" rx="4" fill="#ECECFF" stroke="#9370DB"/>
  <text x="291" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#222">task</text>
  <rect x="282" y="348" width="162" height="26" rx="4" fill="#ECECFF" stroke="#9370DB"/>
  <text x="291" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#222">flaky_community_search</text>
  <rect x="282" y="380" width="162" height="22" rx="4" fill="#F4F4F4" stroke="#C8C8C8"/>
  <text x="291" y="395" font-size="11" fill="#888">write_todos, files (built in)</text>

  <!-- task fan-out -->
  <line x1="444" y1="329" x2="470" y2="329" stroke="#555" stroke-width="1.5"/>
  <line x1="470" y1="272" x2="470" y2="470" stroke="#555" stroke-width="1.5"/>
  <line x1="470" y1="272" x2="498" y2="272" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="342" x2="498" y2="342" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- In-process subagents -->
  <rect x="486" y="210" width="214" height="200" rx="6" fill="#FFFFFF" stroke="#999"/>
  <text x="500" y="232" font-weight="600" fill="#222">Subagents (in process)</text>
  <rect x="500" y="246" width="186" height="52" rx="6" fill="#ECECFF" stroke="#9370DB"/>
  <text x="514" y="267" font-weight="600" fill="#222">knowledge</text>
  <text x="514" y="287" font-size="13" fill="#444">LangGraph workflow</text>
  <rect x="500" y="316" width="186" height="52" rx="6" fill="#ECECFF" stroke="#9370DB"/>
  <text x="514" y="337" font-weight="600" fill="#222">forum_post</text>
  <text x="514" y="357" font-size="13" fill="#444">prompt + tools, approval</text>

  <!-- after_agent -->
  <line x1="255" y1="410" x2="255" y2="428" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="430" width="390" height="82" rx="6" fill="#FFF4D6" stroke="#D9A400"/>
  <text x="76" y="449" font-size="13" font-weight="600" fill="#6B4E00">after_agent</text>
  <rect x="76" y="458" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#D9A400"/>
  <text x="90" y="476" font-weight="600" fill="#6B4E00">Safety check</text>
  <text x="90" y="493" font-size="12" fill="#6B4E00">checks the answer before it's sent</text>

  <!-- Answer -->
  <line x1="255" y1="512" x2="255" y2="560" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="155" y="562" width="200" height="36" rx="18" fill="#ECECFF" stroke="#9370DB"/>
  <text x="255" y="585" text-anchor="middle" fill="#222">Answer</text>

  <!-- network calls to other teams -->
  <line x1="470" y1="470" x2="736" y2="470" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="736" y1="362" x2="736" y2="470" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="736" y1="362" x2="748" y2="362" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="736" y1="462" x2="748" y2="462" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Remote subagents -->
  <text x="750" y="318" font-weight="600" fill="#222">Subagents on other servers</text>
  <rect x="750" y="334" width="230" height="56" rx="6" fill="#ECECFF" stroke="#9370DB"/>
  <text x="764" y="356" font-weight="600" fill="#222">support_case</text>
  <text x="764" y="377" font-size="13" fill="#444">RemoteGraph · another team</text>
  <rect x="750" y="434" width="230" height="56" rx="6" fill="#ECECFF" stroke="#9370DB"/>
  <text x="764" y="456" font-weight="600" fill="#222">customer_success</text>
  <text x="764" y="477" font-size="13" fill="#444">A2A · any stack</text>

  <!-- Legend -->
  <rect x="750" y="540" width="14" height="14" rx="3" fill="#FFF4D6" stroke="#D9A400"/>
  <text x="772" y="552" font-size="13" fill="#555">middleware hook</text>
  <line x1="750" y1="575" x2="764" y2="575" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="772" y="579" font-size="13" fill="#555">over the network</text>
</svg>
