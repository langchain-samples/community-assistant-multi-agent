[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "community-assistant-demo"
version = "0.1.0"
description = "Reference demo: Deep Agents front door orchestrating subgraph, RemoteGraph and A2A agents."
requires-python = ">=3.11,<3.15"
dependencies = [
  "deepagents==0.7.14",
  "langgraph-cli[inmem]==0.4.32",
  "langchain-anthropic==1.7.8",
  "langchain-google-genai==4.4.2",
  "httpx==0.28.1",
  "langsmith==0.14.17",
]

[dependency-groups]
dev = ["ipykernel==7.4.0", "pytest==9.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/community_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
